name: Docker Build & Push

# 监听 master 分支推送，且 package.json 有变更时触发
on:
  push:
    branches: [master]
    paths:
      - 'package.json'

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 需要上一个 commit 用于对比 version

      # 对比当前与上一个 commit 的 version 字段，无变化则跳过构建
      - name: Check version change
        id: check
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -p "require('fs').readFileSync(0,'utf8') | JSON.parse(it).version" || echo "0.0.0")
          echo "Current: $CURRENT, Previous: $PREV"
          if [ "$CURRENT" != "$PREV" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            luochunxiaoman/mcp:${{ steps.check.outputs.version }}
            luochunxiaoman/mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
